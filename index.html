<body class="bg-sand-100 text-ink-700 antialiased min-h-screen">
<div id="app"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4'

const SUPABASE_URL = 'https://lbjqndnafwqdfxhneelt.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_9-E-MZZjQ1x4OVFfBMwIdA_B_zqEU-S'
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const STATUS_ORDER = ['new','received','cutting','sewing','finished_sewing','buttons_in_progress','buttons_finished','ready_for_pickup','delivered']

const STATUS_META = {
  new:                 { label:'طلب جديد',           short:'جديد',        color:'bg-ink-200 text-ink-700' },
  received:            { label:'تم الاستلام',         short:'استلام',      color:'bg-brass/15 text-brass-dark' },
  cutting:             { label:'قص القماش',           short:'قص',          color:'bg-brass/25 text-brass-dark' },
  sewing:              { label:'قيد الخياطة',         short:'خياطة',       color:'bg-brass/35 text-brass-dark' },
  finished_sewing:     { label:'انتهت الخياطة',       short:'خياطة تمت',   color:'bg-palm/15 text-palm' },
  buttons_in_progress: { label:'الأزرار قيد التنفيذ', short:'أزرار',       color:'bg-thread-gold/25 text-brass-dark' },
  buttons_finished:    { label:'انتهت الأزرار',       short:'أزرار تمت',   color:'bg-palm/20 text-palm' },
  ready_for_pickup:    { label:'جاهز للاستلام',       short:'جاهز',        color:'bg-palm/30 text-palm' },
  delivered:           { label:'تم التسليم',          short:'تم التسليم', color:'bg-ink-600 text-cotton' },
}

const TRANSITIONS = {
  new:                 { workshop:['received'] },
  received:            { workshop:['cutting'] },
  cutting:             { workshop:['sewing'] },
  sewing:              { workshop:['finished_sewing'] },
  finished_sewing:     { buttons:['buttons_in_progress'] },
  buttons_in_progress: { buttons:['buttons_finished'] },
  buttons_finished:    { buttons:['ready_for_pickup'] },
  ready_for_pickup:    { shop:['delivered'], delivery:['delivered'] },
}

function nextAllowed(status, role) {
  if (role === 'admin') {
    const i = STATUS_ORDER.indexOf(status)
    return STATUS_ORDER.slice(i + 1)
  }
  return (TRANSITIONS[status] && TRANSITIONS[status][role]) || []
}

const NOTE_FIELD_BY_ROLE = { workshop: 'workshop_notes', buttons: 'buttons_notes' }

const ROLE_LABELS = { admin:'الإدارة', shop:'المحل (الاستقبال)', workshop:'المشغل (الخياطين)', buttons:'قسم الأزرار', delivery:'التسليم' }

const DEPT_VIEW = {
  shop: STATUS_ORDER,
  workshop: ['new','received','cutting','sewing','finished_sewing'],
  buttons: ['finished_sewing','buttons_in_progress','buttons_finished'],
  delivery: ['ready_for_pickup','delivered'],
  admin: STATUS_ORDER,
}

const MEASUREMENT_FIELDS = [
  ['length','الطول (سم)'], ['shoulder','الكتف (سم)'], ['chest','الصدر (سم)'],
  ['waist','الوسط (سم)'], ['sleeve','الكم (سم)'], ['neck','الرقبة (سم)'], ['collar','الياقة (سم)'],
]

const state = {
  session: null,
  profile: null,
  orders: [],
  profiles: [],
  search: '',
  filter: 'all',
  selectedOrder: null,
  showOrderForm: false,
  editingOrder: null,
  notifications: [],
  notifOpen: false,
  ordersChannel: null,
  notifChannel: null,
}

const app = document.getElementById('app')
const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])))
const money = (n) => Number(n || 0).toLocaleString('ar-EG')
const dateAr = (d) => d ? new Date(d).toLocaleDateString('ar-EG') : '—'
const dtAr = (d) => d ? new Date(d).toLocaleString('ar-EG') : '—'

// رقم دولي: يبدأ بـ + أو 00 فيُحفظ كما هو. الرقم المحلي لا يُخمَّن بلده: يُسأل عنه، ويُحفظ اختيار الموظف لهذا الرقم على هذا الجهاز.
const APP_DEFAULT_CC = null // اختياري: ضع كود دولة (مثل '249') فقط إذا أكدت أن كل العملاء المحليين منها
const ccKey = (p) => 'wa_cc_' + String(p||'').replace(/\D/g,'')
const savedCc = (p) => { try { return localStorage.getItem(ccKey(p)) || null } catch (e) { return null } }
function waPhone(p, cc) {
  const raw = String(p||'').trim()
  const d = raw.replace(/\D/g,'')
  if (!d) return null
  if (raw.startsWith('+')) return d
  if (d.startsWith('00')) return d.slice(2)
  const c = cc || savedCc(raw) || APP_DEFAULT_CC
  return c ? c + d.replace(/^0+/, '') : null
}
const remaining = (o) => Math.max(0, Number(o.price||0) - Number(o.deposit||0))
const isOverdue = (o) => o.delivery_date && !o.is_cancelled && o.status !== 'delivered' && new Date(o.delivery_date + 'T23:59:59') < new Date()
const canManage = () => state.profile && (state.profile.role === 'shop' || state.profile.role === 'admin')
function waLink(o, cc) {
  const msg = o.status === 'ready_for_pickup'
    ? `السلام عليكم ${o.customer_name}، طلبك رقم ${o.order_number} جاهز للاستلام. المتبقي: ${money(remaining(o))} ج.س`
    : `السلام عليكم ${o.customer_name}، حالة طلبك رقم ${o.order_number}: ${STATUS_META[o.status].label}`
  const ph = waPhone(o.customer_phone, cc)
  return ph ? `https://wa.me/${ph}?text=${encodeURIComponent(msg)}` : null
}
function printReceipt(o) {
  const w = window.open('', '_blank')
  if (!w) { alert('اسمح بالنوافذ المنبثقة لطباعة الإيصال'); return }
  w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>${esc(o.order_number)}</title><style>body{font-family:Tahoma,Arial,sans-serif;padding:24px;max-width:420px;margin:auto}h1{text-align:center;margin:0 0 4px}hr{margin:12px 0}div.r{display:flex;justify-content:space-between;margin:6px 0}</style></head><body><h1>مشغل الجلابية</h1><p style="text-align:center;margin:0">إيصال طلب ${esc(o.order_number)}</p><hr><div class="r"><span>العميل</span><b>${esc(o.customer_name)}</b></div><div class="r"><span>الهاتف</span><b>${esc(o.customer_phone)}</b></div><div class="r"><span>القماش</span><b>${esc(o.fabric_type)||'—'}</b></div><div class="r"><span>تاريخ التسليم</span><b>${dateAr(o.delivery_date)}</b></div><hr><div class="r"><span>السعر</span><b>${money(o.price)} ج.س</b></div><div class="r"><span>العربون</span><b>${money(o.deposit)} ج.س</b></div><div class="r"><span>المتبقي</span><b>${money(remaining(o))} ج.س</b></div></body></html>`)
  w.document.close()
  setTimeout(() => { w.focus(); w.print() }, 400)
}
function showError(msg) {
  const el = document.getElementById('global-error')
  if (el) { el.textContent = msg; el.classList.remove('hidden') } else alert(msg)
}
const urlCache = {}
const photoUrl = (p) => (!p ? '' : /^https?:/.test(p) ? p : (urlCache[p] || ''))
async function signPaths(paths) {
  const need = [...new Set(paths.filter(p => p && !/^https?:/.test(p) && !urlCache[p]))]
  if (!need.length) return
  const { data, error } = await supabase.storage.from('order-photos').createSignedUrls(need, 3600)
  if (error || !data) return
  data.forEach(d => { if (d.signedUrl && d.path) urlCache[d.path] = d.signedUrl })
}
async function loadOrders() {
  const { data, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false })
  if (error) { showError('تعذر تحميل الطلبات: ' + error.message); return }
  state.orders = data || []
  await signPaths(state.orders.flatMap(o => o.photos || []))
}

async function loadProfiles() {
  const { data } = await supabase.from('profiles').select('*').order('created_at', { ascending: false })
  state.profiles = data || []
}

async function loadNotifications() {
  if (!state.profile) return
  const { data } = await supabase.from('notifications').select('*').eq('target_role', state.profile.role).order('created_at', { ascending: false }).limit(20)
  state.notifications = data || []
}

function subscribeRealtime() {
  if (state.ordersChannel) supabase.removeChannel(state.ordersChannel)
  if (state.notifChannel) supabase.removeChannel(state.notifChannel)

  state.ordersChannel = supabase.channel('orders-live').on('postgres_changes', { event:'*', schema:'public', table:'orders' }, (payload) => {
    if (payload.eventType === 'INSERT') {
      if (!state.orders.some(o => o.id === payload.new.id)) state.orders.unshift(payload.new)
    } else if (payload.eventType === 'UPDATE') {
      state.orders = state.orders.map(o => o.id === payload.new.id ? payload.new : o)
      if (state.selectedOrder && state.selectedOrder.id === payload.new.id) state.selectedOrder = payload.new
    } else if (payload.eventType === 'DELETE') {
      state.orders = state.orders.filter(o => o.id !== payload.old.id)
    }
    render()
  }).subscribe()

  state.notifChannel = supabase.channel('notif-live-' + state.profile.role).on('postgres_changes', { event:'INSERT', schema:'public', table:'notifications', filter:`target_role=eq.${state.profile.role}` }, (payload) => {
    state.notifications.unshift(payload.new)
    render()
  }).subscribe()
}

async function init() {
  const { data: { session } } = await supabase.auth.getSession()
  state.session = session
  if (session) await loadProfileAndData()
  render()

  supabase.auth.onAuthStateChange(async (_event, session) => {
    state.session = session
    if (session) { await loadProfileAndData() } else { state.profile = null }
    render()
  })
}

async function loadProfileAndData() {
  const { data } = await supabase.from('profiles').select('*').eq('id', state.session.user.id).single()
  state.profile = data
  await Promise.all([loadOrders(), loadNotifications()])
  if (state.profile && state.profile.role === 'admin') await loadProfiles()
  subscribeRealtime()
}

async function signIn(email, password) {
  const { error } = await supabase.auth.signInWithPassword({ email, password })
  return error
}

async function signOut() {
  await supabase.auth.signOut()
  state.profile = null
  state.orders = []
  render()
}

function render() {
  if (!state.session) { app.innerHTML = renderLogin(); attachLoginEvents(); return }
  if (!state.profile) { app.innerHTML = fullscreenLoader(); return }
  app.innerHTML = renderShell()
  attachShellEvents()
}

function fullscreenLoader() {
  return `<div class="min-h-screen flex items-center justify-center bg-sand-100"><div class="w-8 h-8 border-4 border-brass border-t-transparent rounded-full animate-spin"></div></div>`
}

function renderLogin() {
  return `
  <div class="min-h-screen bg-ink-700 flex items-center justify-center p-4 relative overflow-hidden" dir="rtl">
    <div class="absolute inset-0 opacity-[0.06] pointer-events-none" style="background-image:repeating-linear-gradient(45deg,transparent,transparent 18px,#C9A24B 18px,#C9A24B 20px)"></div>
    <div class="relative w-full max-w-sm">
      <div class="flex flex-col items-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-brass/15 border border-brass/30 flex items-center justify-center mb-4 text-2xl">✂️</div>
        <h1 class="font-display text-4xl text-cotton tracking-wide">مشغل الجلابية</h1>
        <p class="text-ink-200 font-ui text-sm mt-1">نظام تتبع الطلبات المباشر</p>
      </div>
      <form id="login-form" class="bg-cotton rounded-2xl shadow-lift p-6 space-y-4">
        <div id="login-error"></div>
        <div>
          <label class="label-field">البريد الإلكتروني</label>
          <input type="email" required id="login-email" class="input-field" dir="ltr" placeholder="you@workshop.com" autocomplete="username" />
        </div>
        <div>
          <label class="label-field">كلمة المرور</label>
          <input type="password" required id="login-password" class="input-field" dir="ltr" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button type="submit" id="login-btn" class="btn-primary w-full mt-2">تسجيل الدخول</button>
      </form>
      <p class="text-center text-ink-300 text-xs font-ui mt-6">للحصول على حساب، تواصل مع إدارة المشغل</p>
    </div>
  </div>`
}

function attachLoginEvents() {
  const form = document.getElementById('login-form')
  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    const btn = document.getElementById('login-btn')
    const errBox = document.getElementById('login-error')
    errBox.innerHTML = ''
    btn.disabled = true
    btn.textContent = 'جاري الدخول...'
    const email = document.getElementById('login-email').value.trim()
    const password = document.getElementById('login-password').value
    const error = await signIn(email, password)
    btn.disabled = false
    btn.textContent = 'تسجيل الدخول'
    if (error) {
      const net = /fetch|network|failed/i.test(error.message || '') || error.status === 0
      errBox.innerHTML = `<div class="bg-clay/10 border border-clay/30 text-clay rounded-xl px-4 py-3 text-sm font-ui text-center">${net ? 'تعذر الاتصال بالخادم، تحقق من الإنترنت أو من حالة قاعدة البيانات' : 'البريد الإلكتروني أو كلمة المرور غير صحيحة'}</div>`
    }
  })
}

function renderShell() {
  const role = state.profile.role
  const unread = state.notifications.filter(n => !n.is_read).length
  return `
  <div class="min-h-screen bg-sand-100" dir="rtl">
    <header class="sticky top-0 z-40 bg-cotton/95 backdrop-blur border-b border-sand-300 shadow-soft">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-ink-600 flex items-center justify-center shrink-0 text-brass-light">✂️</div>
          <div class="hidden sm:block">
            <p class="font-display text-xl leading-none text-ink-700 tracking-wide">مشغل الجلابية</p>
            <p class="text-[11px] text-ink-300 font-ui">نظام تتبع الطلبات</p>
          </div>
        </div>
        <div class="flex items-center gap-2 sm:gap-4">
          <div class="hidden sm:flex items-center gap-1.5 text-xs font-ui text-palm bg-palm/10 rounded-full px-3 py-1.5">
            <span class="w-2 h-2 rounded-full bg-palm pulse-live"></span> مباشر
          </div>
          <div class="relative">
            <button id="notif-btn" class="relative w-10 h-10 flex items-center justify-center rounded-full hover:bg-sand-200">
              🔔 ${unread > 0 ? '<span class="absolute top-1 left-1 w-2.5 h-2.5 bg-clay rounded-full ring-2 ring-cotton"></span>' : ''}
            </button>
            ${state.notifOpen ? renderNotifPanel() : ''}
          </div>
          <div class="hidden sm:flex flex-col items-end leading-tight">
            <span class="text-sm font-ui font-semibold text-ink-700">${esc(state.profile.full_name)}</span>
            <span class="text-[11px] text-ink-300 font-ui">${ROLE_LABELS[role]}</span>
          </div>
          <button id="signout-btn" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-sand-200" title="تسجيل الخروج">🚪</button>
        </div>
      </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
      <div id="global-error" class="hidden mb-4 bg-clay/10 border border-clay/30 text-clay rounded-xl px-4 py-3 text-sm font-ui"></div>
      ${renderDashboardBody(role)}
    </main>
  </div>
  ${state.showOrderForm ? renderOrderForm() : ''}
  ${state.selectedOrder ? renderOrderDetail(state.selectedOrder) : ''}
  `
}

function renderNotifPanel() {
  const items = state.notifications
  return `
  <div id="notif-panel" class="absolute left-0 mt-2 w-80 max-h-96 overflow-y-auto card z-50 py-2" dir="rtl">
    <div class="px-4 py-2 font-ui font-bold text-ink-700 border-b border-sand-200">الإشعارات</div>
    ${items.length === 0 ? '<div class="px-4 py-6 text-center text-sm text-ink-300 font-ui">لا توجد إشعارات بعد</div>' :
      items.map(n => `<div class="px-4 py-3 border-b border-sand-100 last:border-0"><p class="text-sm font-ui text-ink-700">${esc(n.message)}</p><p class="text-[11px] text-ink-300 mt-1">${dtAr(n.created_at)}</p></div>`).join('')}
  </div>`
}

function renderDashboardBody(role) {
  const viewStatuses = DEPT_VIEW[role] || STATUS_ORDER
  let list = state.orders.filter(o => viewStatuses.includes(o.status) && (canManage() || !o.is_cancelled))
  if (role !== 'shop' && role !== 'admin') {
    list = [...list].sort((a,b) => new Date(a.created_at) - new Date(b.created_at))
  }
  if (state.filter !== 'all') list = list.filter(o => o.status === state.filter)
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase()
    list = list.filter(o => (o.customer_name||'').toLowerCase().includes(q) || (o.customer_phone||'').includes(q) || (o.order_number||'').toLowerCase().includes(q))
  }

  const titles = { shop:['لوحة المحل','إنشاء الطلبات ومتابعة رحلة كل جلابية لحظة بلحظة'], workshop:['لوحة المشغل','متابعة القص والخياطة وإرسال الطلبات إلى قسم الأزرار'], buttons:['قسم الأزرار','الطلبات المُرسلة من المشغل بعد انتهاء الخياطة'], delivery:['التسليم','تسليم الطلبات الجاهزة للعملاء'], admin:['لوحة الإدارة','إدارة المستخدمين والأقسام ومتابعة أداء المشغل'] }
  const [title, subtitle] = titles[role] || ['لوحة التحكم','']

  return `
    <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
      <div>
        <h1 class="font-display text-3xl sm:text-4xl text-ink-700 tracking-wide">${title}</h1>
        <p class="text-ink-400 font-ui mt-1">${subtitle}</p>
      </div>
      <div class="flex items-center gap-2">
        ${(role === 'shop' || role === 'admin') ? `<button id="new-order-btn" class="btn-brass">+ طلب جديد</button>` : ''}
      </div>
    </div>

    ${renderStageStats(state.orders, viewStatuses)}

    ${role === 'admin' ? renderStaffTable() : ''}

    ${(role === 'shop' || role === 'admin') ? renderFilterChips() : ''}

    <div class="mb-5">
      <div class="relative flex-1 min-w-[220px]">
        <input id="search-input" type="text" value="${esc(state.search)}" placeholder="ابحث بالاسم، رقم الهاتف، أو رقم الطلب..." class="input-field" />
      </div>
    </div>

    ${list.length === 0 ? `<p class="text-center text-ink-300 font-ui py-16">لا توجد طلبات هنا حاليًا</p>` :
      `<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${list.map(o => renderOrderCard(o, role)).join('')}</div>`}
  `
}

function renderFilterChips() {
  const counts = (s) => s === 'all' ? state.orders.length : state.orders.filter(o => o.status === s).length
  return `<div class="flex flex-wrap gap-2 mb-4">
    <button data-filter="all" class="chip ${state.filter==='all'?'chip-active':''} filter-chip">الكل (${counts('all')})</button>
    ${STATUS_ORDER.map(s => `<button data-filter="${s}" class="chip ${state.filter===s?'chip-active':''} filter-chip">${STATUS_META[s].short} (${counts(s)})</button>`).join('')}
  </div>`
}

function renderStageStats(orders, statuses) {
  return `<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6">
    ${statuses.map(s => {
      const meta = STATUS_META[s]
      const count = orders.filter(o => o.status === s).length
      return `<div class="card px-4 py-3.5 flex items-center justify-between">
        <div><p class="text-2xl font-display text-ink-700 leading-none">${count}</p><p class="text-xs font-ui text-ink-400 mt-1.5">${meta.label}</p></div>
        <span class="w-2.5 h-2.5 rounded-full ${meta.color.split(' ')[0]}"></span>
      </div>`
    }).join('')}
  </div>`
}

function renderThread(status, compact) {
  const idx = STATUS_ORDER.indexOf(status)
  const dim = compact ? 6 : 8
  return `<div class="w-full overflow-x-auto pb-1"><div class="flex items-center min-w-max">
    ${STATUS_ORDER.map((s,i) => {
      const done = i < idx, active = i === idx
      const circleCls = done ? 'bg-palm border-palm text-cotton' : active ? 'bg-brass border-brass text-cotton pulse-live' : 'bg-cotton border-sand-300 text-ink-300'
      const label = compact ? '' : `<span class="text-[11px] font-ui text-center leading-tight mt-1.5 ${active?'text-brass-dark font-bold':done?'text-palm font-semibold':'text-ink-300'}">${STATUS_META[s].short}</span>`
      const line = i < STATUS_ORDER.length - 1 ? `<div class="h-[2px] shrink-0 ${compact?'w-4':'w-8'} ${i<idx?'stitch-done':'stitch-todo'}"></div>` : ''
      return `<div class="flex items-center"><div class="flex flex-col items-center" style="width:${compact?56:84}px"><div class="flex items-center justify-center rounded-full border-2 shrink-0 w-${dim} h-${dim} ${circleCls}" style="width:${compact?24:32}px;height:${compact?24:32}px;font-size:${compact?10:12}px">${done?'✓':i+1}</div>${label}</div>${line}</div>`
    }).join('')}
  </div></div>`
}

function renderOrderCard(o, role) {
  const meta = STATUS_META[o.status]
  const actions = renderStatusActions(o, role, true)
  return `<div class="card p-4 sm:p-5 hover:shadow-lift transition-shadow">
    <button data-open-order="${o.id}" class="text-right flex-1 min-w-0 w-full">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="font-ui font-bold text-brass-dark text-sm tracking-wide">${esc(o.order_number)}</span>
        <span class="inline-flex items-center rounded-full font-ui font-semibold text-xs px-2 py-0.5 ${meta.color}">${meta.label}</span>
        ${o.photos && o.photos.length ? `<span class="text-ink-300 text-xs">📷 ${o.photos.length}</span>` : ''}
      </div>
      <h3 class="font-ui font-bold text-lg text-ink-700 mt-1.5 truncate">${esc(o.customer_name)}</h3>
      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-1.5 text-sm text-ink-400 font-ui">
        <span>📞 ${esc(o.customer_phone)}</span>
        ${o.delivery_date ? `<span>📅 ${dateAr(o.delivery_date)}</span>` : ''}
        <span>💵 ${money(o.price)} ج.س</span>
        ${Number(o.deposit||0) > 0 ? `<span>المتبقي: ${money(remaining(o))}</span>` : ''}
        ${isOverdue(o) ? '<span class="text-clay font-bold">⚠️ متأخر</span>' : ''}
        ${o.is_cancelled ? '<span class="text-clay font-bold">⛔ ملغي</span>' : ''}
      </div>
    </button>
    <div class="mt-4">${renderThread(o.status, true)}</div>
    ${actions ? `<div class="mt-4 flex flex-wrap gap-2 pt-3 border-t border-sand-200">${actions}</div>` : ''}
  </div>`
}

function renderStatusActions(o, role, small) {
  if (o.is_cancelled) return ''
  const options = nextAllowed(o.status, role)
  if (options.length === 0) return ''
  return options.map(s => `<button data-status-btn="${o.id}" data-next-status="${s}" class="btn-brass ${small ? '!px-3.5 !py-2 !text-sm' : ''}">${STATUS_META[s].label}</button>`).join('')
}

function attachShellEvents() {
  const notifBtn = document.getElementById('notif-btn')
  if (notifBtn) notifBtn.addEventListener('click', async (e) => {
    e.stopPropagation()
    state.notifOpen = !state.notifOpen
    if (state.notifOpen) {
      const unreadIds = state.notifications.filter(n => !n.is_read).map(n => n.id)
      state.notifications = state.notifications.map(n => ({ ...n, is_read: true }))
      if (unreadIds.length) supabase.from('notifications').update({ is_read: true }).in('id', unreadIds)
    }
    render()
  })
  document.addEventListener('click', () => { if (state.notifOpen) { state.notifOpen = false; render() } }, { once: true })

  const signoutBtn = document.getElementById('signout-btn')
  if (signoutBtn) signoutBtn.addEventListener('click', signOut)

  const searchInput = document.getElementById('search-input')
  if (searchInput) {
    searchInput.addEventListener('input', (e) => { state.search = e.target.value; renderBodyOnly() })
    searchInput.focus()
    searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length)
  }

  document.querySelectorAll('.filter-chip').forEach(btn => btn.addEventListener('click', () => { state.filter = btn.dataset.filter; render() }))

  document.querySelectorAll('[data-open-order]').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.openOrder
    state.selectedOrder = state.orders.find(o => o.id === id)
    render()
  }))

  const newOrderBtn = document.getElementById('new-order-btn')
  if (newOrderBtn) newOrderBtn.addEventListener('click', () => { state.editingOrder = null; pendingPhotos = []; state.showOrderForm = true; render() })

  document.querySelectorAll('[data-status-btn]').forEach(btn => btn.addEventListener('click', async () => {
    const orderId = btn.dataset.statusBtn
    const nextStatus = btn.dataset.nextStatus
    await performStatusChange(orderId, nextStatus)
  }))

  document.querySelectorAll('[data-role-select]').forEach(sel => sel.addEventListener('change', async () => {
    await supabase.from('profiles').update({ role: sel.value }).eq('id', sel.dataset.roleSelect)
    await loadProfiles()
    render()
  }))

  document.querySelectorAll('[data-toggle-active]').forEach(btn => btn.addEventListener('click', async () => {
    const newVal = btn.dataset.current !== 'true'
    await supabase.from('profiles').update({ is_active: newVal }).eq('id', btn.dataset.toggleActive)
    await loadProfiles()
    render()
  }))

  const detailClose = document.getElementById('detail-close')
  const detailBackdrop = document.getElementById('detail-backdrop')
  if (detailClose) detailClose.addEventListener('click', () => { state.selectedOrder = null; render() })
  if (detailBackdrop) detailBackdrop.addEventListener('click', () => { state.selectedOrder = null; render() })

  const formClose = document.getElementById('form-close')
  const formCancel = document.getElementById('form-cancel')
  const formBackdrop = document.getElementById('form-backdrop')
  const closeForm = () => { state.showOrderForm = false; state.editingOrder = null; pendingPhotos = []; render() }
  if (formClose) formClose.addEventListener('click', closeForm)
  if (formCancel) formCancel.addEventListener('click', closeForm)
  if (formBackdrop) formBackdrop.addEventListener('click', closeForm)

  const photoInput = document.getElementById('f-photos')
  if (photoInput) photoInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || [])
    for (const file of files) {
      const path = `${Date.now()}-${Math.random().toString(36).slice(2)}-${file.name}`
      const { error } = await supabase.storage.from('order-photos').upload(path, file)
      if (!error) {
        await signPaths([path])
        pendingPhotos.push(path)
        renderPhotoPreview()
      }
    }
  })

  document.querySelectorAll('[data-remove-photo]').forEach(btn => btn.addEventListener('click', () => {
    pendingPhotos.splice(Number(btn.dataset.removePhoto), 1)
    renderPhotoPreview()
  }))

  const orderForm = document.getElementById('order-form')
  if (orderForm) {
    orderForm.addEventListener('submit', handleCreateOrder)
    const eo = state.editingOrder
    if (eo) {
      const set = (id, v) => { document.getElementById(id).value = v == null ? '' : v }
      set('f-name', eo.customer_name); set('f-phone', eo.customer_phone); set('f-fabric', eo.fabric_type)
      set('f-date', eo.delivery_date); set('f-price', eo.price); set('f-deposit', eo.deposit); set('f-notes', eo.design_notes)
      document.querySelectorAll('[data-measure]').forEach(inp => { inp.value = (eo.measurements || {})[inp.dataset.measure] || '' })
      renderPhotoPreview()
    }
  }
  document.querySelectorAll('.overflow-x-auto .pulse-live').forEach(el => {
    const box = el.closest('.overflow-x-auto')
    if (!box) return
    const b = box.getBoundingClientRect(), r = el.getBoundingClientRect()
    box.scrollLeft += (r.left + r.width / 2) - (b.left + b.width / 2)
  })
  const findOrder = (btn) => state.orders.find(o => o.id === btn.dataset.order)
  const wb = document.getElementById('wa-ask-btn'); if (wb) wb.addEventListener('click', () => {
    const cc = (prompt('رقم العميل بدون كود دولة. اكتب كود الدولة (مثال: 249 للسودان، 20 لمصر):') || '').replace(/\D/g,'')
    if (!cc) return
    const o0 = findOrder(wb)
    try { localStorage.setItem(ccKey(o0.customer_phone), cc) } catch (e) {}
    const link = waLink(o0, cc)
    if (link) window.open(link, '_blank', 'noopener')
  })
  const pb = document.getElementById('print-btn'); if (pb) pb.addEventListener('click', () => printReceipt(findOrder(pb)))
  const eb = document.getElementById('edit-btn'); if (eb) eb.addEventListener('click', () => { const o = findOrder(eb); state.editingOrder = o; pendingPhotos = [...(o.photos || [])]; state.selectedOrder = null; state.showOrderForm = true; render() })
  const bb = document.getElementById('back-btn'); if (bb) bb.addEventListener('click', async () => {
    const o = findOrder(bb); const prev = STATUS_ORDER[STATUS_ORDER.indexOf(o.status) - 1]
    if (!confirm(`إرجاع الطلب إلى «${STATUS_META[prev].label}»؟`)) return
    const { error } = await supabase.from('orders').update({ status: prev }).eq('id', o.id)
    if (error) { alert('تعذر الإرجاع: ' + error.message); return }
    await loadOrders(); state.selectedOrder = state.orders.find(x => x.id === o.id); render()
  })
  const cb = document.getElementById('cancel-order-btn'); if (cb) cb.addEventListener('click', async () => {
    const o = findOrder(cb)
    if (!confirm(`إلغاء الطلب ${o.order_number} للعميل ${o.customer_name}؟`)) return
    const { error } = await supabase.from('orders').update({ is_cancelled: true }).eq('id', o.id)
    if (error) { alert('تعذر الإلغاء: ' + error.message); return }
    await loadOrders(); state.selectedOrder = state.orders.find(x => x.id === o.id); render()
  })
}

function renderBodyOnly() {
  const main = document.querySelector('main')
  if (main) main.innerHTML = renderDashboardBody(state.profile.role)
  attachShellEvents()
  const s = document.getElementById('search-input')
  if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length) }
}

async function performStatusChange(orderId, nextStatus) {
  const role = state.profile.role
  let note = null
  if (NOTE_FIELD_BY_ROLE[role]) {
    note = prompt(`ملاحظة قبل الانتقال إلى «${STATUS_META[nextStatus].label}» (اختياري، اتركها فاضية للتخطي)`)
  }
  const payload = { status: nextStatus }
  if (note && NOTE_FIELD_BY_ROLE[role]) payload[NOTE_FIELD_BY_ROLE[role]] = note.trim()
  const { error } = await supabase.from('orders').update(payload).eq('id', orderId)
  if (error) { alert('تعذر تحديث الحالة: ' + error.message); return }
  await loadOrders()
  render()
}

async function handleCreateOrder(e) {
  e.preventDefault()
  const errBox = document.getElementById('form-error')
  errBox.innerHTML = ''
  const name = document.getElementById('f-name').value.trim()
  const phone = document.getElementById('f-phone').value.trim()
  if (!name || !phone) { errBox.innerHTML = `<div class="bg-clay/10 border border-clay/30 text-clay rounded-xl px-4 py-3 text-sm font-ui">الاسم ورقم الهاتف مطلوبان</div>`; return }

  const submitBtn = document.getElementById('form-submit')
  submitBtn.disabled = true
  submitBtn.textContent = 'جاري الحفظ...'

  const measurements = {}
  document.querySelectorAll('[data-measure]').forEach(inp => { if (inp.value) measurements[inp.dataset.measure] = inp.value })

  try {
    let { data: existingCustomer } = await supabase.from('customers').select('id').eq('phone', phone).maybeSingle()
    let customerId = existingCustomer && existingCustomer.id
    if (!customerId) {
      const { data: newCustomer, error: custErr } = await supabase.from('customers').insert({ name, phone }).select('id').single()
      if (custErr) throw custErr
      customerId = newCustomer.id
    }
    const fields = {
      customer_id: customerId,
      customer_name: name,
      customer_phone: phone,
      measurements,
      fabric_type: document.getElementById('f-fabric').value.trim() || null,
      design_notes: document.getElementById('f-notes').value.trim() || null,
      delivery_date: document.getElementById('f-date').value || null,
      price: document.getElementById('f-price').value ? Number(document.getElementById('f-price').value) : 0,
      deposit: document.getElementById('f-deposit').value ? Number(document.getElementById('f-deposit').value) : 0,
      photos: pendingPhotos,
    }
    if (fields.deposit > fields.price) throw new Error('العربون أكبر من السعر')
    let orderErr
    if (state.editingOrder) {
      ;({ error: orderErr } = await supabase.from('orders').update(fields).eq('id', state.editingOrder.id))
    } else {
      ;({ error: orderErr } = await supabase.from('orders').insert({ ...fields, status: 'new', created_by: state.profile.id }))
    }
    if (orderErr) throw orderErr
    await loadOrders()
    state.showOrderForm = false
    state.editingOrder = null
    pendingPhotos = []
    render()
  } catch (err) {
    errBox.innerHTML = `<div class="bg-clay/10 border border-clay/30 text-clay rounded-xl px-4 py-3 text-sm font-ui">فشل حفظ الطلب: ${esc(err.message)}</div>`
    submitBtn.disabled = false
    submitBtn.textContent = state.editingOrder ? 'حفظ التعديلات' : 'حفظ الطلب'
  }
}

init()
</script>
